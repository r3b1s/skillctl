name: Publish AUR Package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to publish to the AUR, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    env:
      AUR_PACKAGE_NAME: skillctl
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release_tag="${EVENT_RELEASE_TAG}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
          fi
          [[ -n "${release_tag}" ]] || {
            echo "Could not determine release tag." >&2
            exit 1
          }
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)?$ ]] || {
            echo "Release tag must look like v0.1.1, got: ${RELEASE_TAG}" >&2
            exit 1
          }

      - name: Compute release archive checksum
        id: tarball
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          archive_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          curl -fsSL "${archive_url}" -o release.tar.gz
          archive_sha256="$(sha256sum release.tar.gz | awk '{print $1}')"
          {
            echo "archive_url=${archive_url}"
            echo "archive_sha256=${archive_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Render PKGBUILD
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
          ARCHIVE_SHA256: ${{ steps.tarball.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          ./packaging/aur/render-pkgbuild.sh "${RELEASE_TAG}" "${ARCHIVE_SHA256}" packaging/aur/PKGBUILD

      - name: Configure AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          aur_ssh_key_path="${HOME}/.ssh/aur"
          [[ -n "${AUR_SSH_PRIVATE_KEY}" ]] || {
            echo "Missing required secret: AUR_SSH_PRIVATE_KEY" >&2
            exit 1
          }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > "${aur_ssh_key_path}"
          chmod 600 "${aur_ssh_key_path}"
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repository
        env:
          GIT_SSH_COMMAND: ssh -i ${HOME}/.ssh/aur -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE_NAME}.git" aur

      - name: Update AUR package files
        run: |
          set -euo pipefail
          cp packaging/aur/PKGBUILD aur/PKGBUILD
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}/aur:/work" \
            -w /work \
            archlinux:base-devel \
            bash -lc 'makepkg --printsrcinfo > .SRCINFO'

      - name: Commit and push to AUR
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
          GIT_SSH_COMMAND: ssh -i ${HOME}/.ssh/aur -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          cd aur
          if git diff --quiet; then
            echo "AUR repository already matches ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "r3g1s"
          git config user.email "21206554+r3b1s@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${RELEASE_TAG}"
          git push origin master
