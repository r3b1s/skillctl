name: Shell CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          files=(
            skillctl
            install.sh
            install-remote.sh
            skillctl-update
            skillctl-uninstall
            packaging/aur/render-pkgbuild.sh
          )
          shellcheck "${files[@]}" || true
          shellcheck -S info "${files[@]}"

      - name: Parse shell scripts
        run: |
          set -euo pipefail
          bash -n skillctl install.sh install-remote.sh skillctl-update skillctl-uninstall packaging/aur/render-pkgbuild.sh
